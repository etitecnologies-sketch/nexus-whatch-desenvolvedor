# MediaMTX Configuration for Nexus Watch
# Documentation: https://github.com/bluenviron/mediamtx

# Allow any source by default, but we'll use the API to add paths
paths:
  all:
    # Disable global source so we only have paths we add via API
    source: null

# HLS (HTTP Live Streaming)
# Accessible at http://[host]:8888/[path]/index.m3u8
hls: yes
hlsAddress: :8888
hlsVariant: lowLatency

# WebRTC (Real-Time Communication)
# Accessible at http://[host]:8889/[path]
webrtc: yes
webrtcAddress: :8889
webrtcICEUDP: yes

# API for dynamic path management
# Used by the backend to register DVR/NVR channels
api: yes
apiAddress: :9999

# Logging
logLevel: info
logDestinations: [stdout]
